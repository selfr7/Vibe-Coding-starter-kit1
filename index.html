<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的项目</title>
  </head>
  <body>
    <div id="root">
      <!-- 启动兜底提示：项目正常启动时，React 会立刻用真正的页面替换掉下面这段内容。
           如果你一直看到这段话，说明项目没有用正确方式启动（多半是直接双击了 index.html）。 -->
      <div style="font-family: system-ui, -apple-system, sans-serif; max-width: 480px; margin: 35vh auto 0; padding: 0 24px; text-align: center; color: #555;">
        <p style="font-size: 20px; font-weight: 700; color: #111; margin: 0 0 14px;">⏳ 正在启动…</p>
        <p style="font-size: 14px; line-height: 1.9; margin: 0;">
          如果这句话一直没变成「🎉 跑起来了！」，说明项目没有通过正确方式启动。<br />
          <b>不要直接双击 index.html 打开</b>——这类项目要在终端里运行 <b>npm run dev</b>，<br />
          然后访问它提示的网址（一般是 http://localhost:5173）。
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
